# Local development database: `docker compose up -d`, then run the API (it migrates on start).
# Matches ConnectionStrings:Rose in src/Rose.Api/appsettings.Development.json.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rose
      POSTGRES_USER: rose
      POSTGRES_PASSWORD: rose
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rose-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rose -d rose"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rose-pg: