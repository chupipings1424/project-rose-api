name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Windows, because the desktop alarm and the time-zone tests target Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ProjectRose.Api.sln

      - name: Build (warnings are errors)
        run: dotnet build ProjectRose.Api.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ProjectRose.Api.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults